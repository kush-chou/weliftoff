name: Student Template PR Verification

on:
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 50

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant Execute Permissions
        run: chmod +x gradlew

      - name: Run Lint and Unit Tests
        run: ./gradlew lintDebug testDebugUnitTest

      - name: Verify Zero-Egress Invariant
        run: ./gradlew verifyZeroEgress

      - name: Audit Git Commit Trailers
        run: |
          COMMITS=$(git rev-list --no-merges origin/${{ github.base_ref }}..HEAD)
          for commit in $COMMITS; do
            BODY=$(git log -n 1 --format=%B $commit)
            echo "Checking commit $commit..."
            if ! echo "$BODY" | grep -q "Agent: antigravity"; then
              echo "Error: Commit $commit missing 'Agent: antigravity' trailer." >&2
              exit 1
            fi
            if ! echo "$BODY" | grep -q "Co-authored-by:"; then
              echo "Error: Commit $commit missing 'Co-authored-by:' attribution trailer." >&2
              exit 1
            fi
          done
          echo "Commit attribution trailer audit passed."
